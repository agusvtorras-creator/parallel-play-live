<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallel Play Live</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-badge">🎯</div>
    <div>
      <h1>Parallel Play Live</h1>
      <div class="subtitle">Practice parallelism in real time</div>
    </div>
  </div>
  <div class="mode-grid">
    <a href="/host.html" style="text-decoration:none;">
      <div class="mode-card">
        <h3>🖥️ I'm the host</h3>
        <p>Open this on the projector or your laptop. It creates the room code and runs the game.</p>
      </div>
    </a>
    <a href="/player.html" style="text-decoration:none;">
      <div class="mode-card">
        <h3>📱 I'm a player</h3>
        <p>Open this on your phone. You'll type in the room code the host shows on screen.</p>
      </div>
    </a>
  </div>
</div>
</body>
</html>
